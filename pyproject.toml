[project]
name = "formsync"
version = "0.1.0"
description = "Dance formation & synchronization analyzer: pose estimation, sync/formation scoring, and agent-written rehearsal feedback."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Devam" }]
dependencies = [
  "ultralytics>=8.3",
  "opencv-python-headless>=4.10",
  "numpy>=2,<3",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "imageio-ffmpeg>=0.5",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13",
  "sqlmodel>=0.0.21",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "langchain-google-genai>=2.0",
  "tenacity>=8.3",
  "pyyaml>=6",
]

[project.optional-dependencies]
groq = ["langchain-groq>=0.2"]
ollama = ["langchain-ollama>=0.2"]
anthropic = ["langchain-anthropic>=0.3"]
openvino = ["openvino>=2025.0"]
s3 = ["boto3>=1.34"]

[project.scripts]
formsync = "formsync.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  "types-PyYAML",
  "interrogate>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formsync"]

# Route torch/torchvision to the CPU-only wheel index (~200 MB instead of ~2 GB CUDA builds).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -q"
markers = [
  "slow: runs the real pose model on a video fixture; excluded by default (use `pytest -m slow`)",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]  # one-blank-line-before-class / multi-line-summary-second-line: pick the Google-ish style

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/formsync"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "ultralytics.*",
  "cv2.*",
  "librosa.*",
  "soundfile.*",
  "imageio_ffmpeg.*",
  "scipy.*",
  "pyarrow.*",
]
ignore_missing_imports = true

[tool.interrogate]
paths = ["src/formsync", "tests"]
fail-under = 100
ignore-init-method = false
ignore-magic = true
ignore-nested-functions = false
verbose = 1
